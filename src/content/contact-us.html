<section class="contact-layout">
  <div class="contact-image">
    <img src="/assets/images/hands-together.jpg" width="559" height="419" alt="Hashers placing their hands together">
  </div>
  <div class="contact-copy">
    <h3>Get in Touch</h3>
    <p>Questions about a first trail, visiting-hasher logistics, accessibility, or a current event? We can help.</p>
    <p>For community updates, visit the <a href="https://www.facebook.com/groups/UtahH3/" target="_blank" rel="nofollow noopener noreferrer">Utah H3 Facebook group</a>.</p>
    <p>Direct email: <a href="mailto:ZiON-ON@hotmail.com">ZiON-ON@hotmail.com</a></p>

    <form class="contact-form" data-contact-form>
      <div class="form-row">
        <label>First name <span aria-hidden="true">*</span><input name="firstName" autocomplete="given-name" required></label>
        <label>Last name<input name="lastName" autocomplete="family-name"></label>
      </div>
      <label>Email <span aria-hidden="true">*</span><input name="email" type="email" autocomplete="email" required></label>
      <label>Comment or Message <span aria-hidden="true">*</span><textarea name="message" required></textarea></label>
      <label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <div class="cf-turnstile" data-sitekey="__TURNSTILE_SITE_KEY__" data-action="contact"></div>
      <button type="submit">Submit</button>
      <p class="form-status" data-form-status role="status" aria-live="polite"></p>
    </form>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </div>
</section>
